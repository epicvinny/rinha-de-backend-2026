services:
  lb:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-2026-perf:local
    environment:
      - LB_TRACE=1
      - LB_TRACE_EVERY=${LB_TRACE_EVERY:-10000}
      - LB_TRACE_SLOW_US=${LB_TRACE_SLOW_US:-1000}
      - LB_TRACE_SAMPLE=${LB_TRACE_SAMPLE:-0}

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-2026-perf:local
    environment:
      - PERF_TRACE=1
      - PERF_TRACE_EVERY=${PERF_TRACE_EVERY:-10000}
      - PERF_TRACE_SLOW_US=${PERF_TRACE_SLOW_US:-1000}
      - PERF_TRACE_SAMPLE=${PERF_TRACE_SAMPLE:-0}

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    image: rinha-2026-perf:local
    environment:
      - PERF_TRACE=1
      - PERF_TRACE_EVERY=${PERF_TRACE_EVERY:-10000}
      - PERF_TRACE_SLOW_US=${PERF_TRACE_SLOW_US:-1000}
      - PERF_TRACE_SAMPLE=${PERF_TRACE_SAMPLE:-0}
