[package]
name = "api"
version = "0.1.0"
edition = "2021"

[dependencies]
shared = { path = "../shared" }
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["io-util", "macros", "rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
bytes = "1"
libc = "0.2"
mimalloc = { version = "0.1", default-features = false }
io-uring = "0.7.12"
