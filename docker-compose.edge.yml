services:
  lb:
    image: ${RINHA_IMAGE:-rinha-2026-perf:local}
    command: ["/opt/edge"]
    ports:
      - "9999:9999"
    environment:
      - EDGE_LISTEN=0.0.0.0:9999
      - INDEX_PATH=/opt/index.bin
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9999/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "0.80"
          memory: "260MB"
    networks:
      - rinha

  api1:
    image: ${RINHA_IMAGE:-rinha-2026-perf:local}
    command: ["/opt/placeholder"]
    environment:
      - PLACEHOLDER_LISTEN=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "45MB"
    networks:
      - rinha

  api2:
    image: ${RINHA_IMAGE:-rinha-2026-perf:local}
    command: ["/opt/placeholder"]
    environment:
      - PLACEHOLDER_LISTEN=0.0.0.0:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "45MB"
    networks:
      - rinha

networks:
  rinha:
    driver: bridge
